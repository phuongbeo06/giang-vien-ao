<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giảng viên ảo – Biến PDF thành bài giảng</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--surface:#fff;--ink:#1d2a2f;--muted:#5d6b70;--line:#ddd6c8;--accent:#0f766e;--accent-ink:#fff;--board:#1f4d3f;--board-ink:#f3f7f2;--chalk:#ffe08a;--skin:#f2c9a5;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--surface:#1d2528;--ink:#e9efef;--muted:#9aa9ad;--line:#2f3b3f;--accent:#2dd4bf;--accent-ink:#06211e;--board:#17382e;--board-ink:#eef6ee;--skin:#e6b995;}}
:root[data-theme="dark"]{--bg:#14191b;--surface:#1d2528;--ink:#e9efef;--muted:#9aa9ad;--line:#2f3b3f;--accent:#2dd4bf;--accent-ink:#06211e;--board:#17382e;--board-ink:#eef6ee;--skin:#e6b995;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:40px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent)}
.drop b{display:block;font-size:1.1rem;margin-bottom:4px}
.drop span{color:var(--muted);font-size:.92rem}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 8px;max-width:100%}
.hide{display:none!important}
.prog{margin-top:16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.msg{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.err{color:#c2410c}
.player{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
@media (max-width:820px){.player{grid-template-columns:1fr}}
.stage{display:grid;grid-template-columns:1fr 190px;gap:12px;align-items:end}
@media (max-width:560px){.stage{grid-template-columns:1fr 100px}}
.board{background:var(--board);color:var(--board-ink);border:8px solid #8a6a43;border-radius:12px;padding:28px 32px;min-height:400px;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
.board h2{margin:0 0 18px;font-size:1.65rem;color:var(--chalk);font-weight:600}
.board ul{margin:0;padding-left:20px}
.board li{margin:0 0 12px;font-size:1.2rem;opacity:0;transform:translateY(6px);transition:all .4s}
.board li.on{opacity:1;transform:none}
.tag{font-size:.78rem;color:var(--muted);margin:0 0 6px}
.teacher svg{width:100%;height:auto;display:block}
.mouth{transform-origin:100px 96px;transform:scaleY(.25)}
.talking .mouth{animation:talk .28s infinite alternate}
@keyframes talk{to{transform:scaleY(1.2)}}
.eyes{transform-origin:100px 76px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.arm{transform-origin:150px 150px}
.talking .arm{animation:point 1.6s infinite ease-in-out}
@keyframes point{50%{transform:rotate(-14deg)}}
.talking .head{animation:nod 1.2s infinite ease-in-out}
@keyframes nod{50%{transform:translateY(2px)}}
svg.m .fonly,svg.f .monly{display:none}
.caption{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:76px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ctrl .sp{flex:1}
.seek{width:100%;accent-color:var(--accent);margin-top:12px}
.side{max-height:560px;overflow:auto}
.side h3{margin:0 0 10px;font-size:1rem}
.les{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px}
.les.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.les small{display:block;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--muted);align-items:center}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;white-space:nowrap}
.vis{margin-top:14px;border-top:1px dashed rgba(255,255,255,.3);padding-top:12px}
.vis:empty{display:none}
.vcap{font-size:.85rem;color:var(--chalk);margin:0 0 8px}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.vw{display:flex;align-items:center;gap:8px;opacity:0;transform:scale(.9);transition:all .4s}
.vw.on{opacity:1;transform:none}
.ar{font-size:1.1rem;color:var(--chalk);font-weight:700}
.vi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 14px;text-align:center;min-width:100px;transition:all .3s}
.vw.focus .vi{border-color:var(--chalk);background:rgba(255,224,138,.2);box-shadow:0 0 0 2px var(--chalk);transform:scale(1.05)}
.ic{font-size:2.3rem;line-height:1.15}
.lb{font-size:1rem;font-weight:600}
.sb{font-size:.85rem;opacity:.8}
.recbox{background:var(--bg);padding:8px;border-radius:12px}
a.dl{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}
.kin{width:100%;margin-top:6px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 Giảng viên ảo</h1>
  <p class="sub">Tải PDF lên, giảng viên sẽ giảng lại nội dung theo từng bài, dễ hiểu như đang đứng lớp.</p>

  <div id="up">
    <div class="card" style="margin-bottom:16px">
      <label><b>Dùng dịch vụ AI nào để soạn bài giảng?</b><br>
        <select id="prov" style="margin-top:6px"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI</option></select></label>
      <div id="box_a" style="margin-top:12px"><label><b>Khóa API Anthropic</b><br><input id="key" class="kin" type="password" placeholder="sk-ant-..." autocomplete="off"></label></div>
      <div id="box_o" class="hide" style="margin-top:12px">
        <label><b>Khóa API OpenAI</b><br><input id="okey" class="kin" type="password" placeholder="sk-..." autocomplete="off"></label>
        <label style="display:block;margin-top:10px"><b>Tên model OpenAI</b> <span class="msg" style="display:inline">(có thể sửa)</span><br><input id="omodel" class="kin" list="omodels" autocomplete="off"><datalist id="omodels"><option value="gpt-5.6-sol"><option value="gpt-5.6-terra"><option value="gpt-5.6-luna"><option value="gpt-6-astra"></datalist></label>
      </div>
      <p class="msg" id="keynote"></p>
    </div>
    <label class="drop" id="drop">
      <input id="file" type="file" accept="application/pdf" hidden>
      <b>Bấm để chọn file PDF hoặc kéo thả vào đây</b>
      <span>Hoạt động tốt nhất với PDF có chữ chọn được (không phải bản scan)</span>
    </label>
    <div class="prog hide" id="prog">
      <div class="bar"><i id="barfill"></i></div>
      <p class="msg" id="status"></p>
    </div>
    <p class="msg err hide" id="err"></p>
    <p style="margin:14px 0 0"><button id="imp_up">📂 Mở kịch bản JSON đã tải</button></p>
    <div class="card hide" id="saved" style="margin-top:16px"><h3 style="margin:0 0 10px;font-size:1rem">Bài giảng đã lưu trên máy này</h3><div id="savedlist"></div></div>
  </div>

  <div class="player hide" id="player">
    <div>
      <div id="recbox" class="recbox"><p class="tag" id="tag"></p>
      <div class="stage" id="stage">
        <div class="board"><h2 id="head"></h2><ul id="pts"></ul><div id="vis" class="vis"></div></div>
        <div class="teacher">
          <svg id="tsvg" class="m" viewBox="0 0 200 270" aria-label="Giảng viên">
            <g class="arm"><path d="M150 150 Q185 130 178 98" stroke="var(--skin)" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="178" cy="95" r="8" fill="var(--skin)"/></g>
            <path d="M45 270 L50 160 Q100 135 150 160 L155 270Z" fill="#3b5b8c"/>
            <path class="monly" d="M92 152 L108 152 L112 215 L100 225 L88 215Z" fill="#b4332b"/>
            <path d="M85 148 L100 172 L115 148Z" fill="#fff"/>
            <rect x="88" y="128" width="24" height="26" fill="var(--skin)"/>
            <g class="head">
              <path class="fonly" d="M52 82 Q50 20 100 20 Q150 20 148 82 L152 150 Q130 140 128 100 L72 100 Q70 140 48 150Z" fill="#3a2a22"/>
              <ellipse cx="100" cy="82" rx="42" ry="48" fill="var(--skin)"/>
              <path class="monly" d="M56 74 Q52 26 100 28 Q148 26 144 74 Q132 48 100 50 Q68 48 56 74Z" fill="#2b2320"/>
              <path class="fonly" d="M58 70 Q70 36 100 38 Q130 36 142 70 Q120 52 100 56 Q80 52 58 70Z" fill="#3a2a22"/>
              <g class="eyes"><circle cx="84" cy="76" r="4" fill="#222"/><circle cx="116" cy="76" r="4" fill="#222"/></g>
              <g fill="none" stroke="#222" stroke-width="2.5"><circle cx="84" cy="76" r="11"/><circle cx="116" cy="76" r="11"/><path d="M95 76 L105 76"/></g>
              <ellipse class="mouth" cx="100" cy="96" rx="9" ry="6" fill="#8b2e2e"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="caption" id="cap"></div></div>
      <input class="seek" id="seek" type="range" min="0" max="0" value="0" aria-label="Chuyển slide">
      <div class="ctrl">
        <button id="prev" aria-label="Slide trước">⏮</button>
        <button id="play" class="pri">▶ Bắt đầu giảng</button>
        <button id="next" aria-label="Slide sau">⏭</button>
        <span class="time" id="time" title="Thời lượng ước tính theo tốc độ đọc">0:00 / 0:00</span>
        <span class="sp"></span>
        <button id="again">↻ Giảng lại slide</button>
        <button id="rec">⏺ Ghi video để tải</button>
      </div>
      <div class="opts">
        <label>Giảng viên <select id="who"><option value="m">Thầy</option><option value="f">Cô</option></select></label>
        <label>Giọng <select id="voice"></select></label>
        <label>Nghỉ giữa câu <select id="gap"><option value="250">Ngắn</option><option value="500" selected>Vừa</option><option value="900">Dài</option></select></label>
        <label>Tốc độ <select id="rate"><option value="0.75">Chậm</option><option value="0.92" selected>Vừa</option><option value="1.1">Nhanh</option></select></label>
        <button id="dl_script" style="margin-left:auto;font-size:0.9rem;padding:6px 12px">💾 Tải kịch bản JSON</button>
        <button id="imp" style="font-size:0.9rem;padding:6px 12px">📂 Mở kịch bản JSON</button>
      </div>
      <p class="msg" id="vmsg"></p>
      <p class="msg" id="recmsg"></p>
      <div id="recout" class="hide"><video id="recvid" controls style="width:100%;max-width:640px;border-radius:10px"></video><br><a id="recdl" class="dl" download>⬇ Tải video xuống</a></div>
    </div>
    <div class="card side"><h3>Các bài giảng</h3><div id="list"></div><p class="msg" id="gen"></p><button id="reset" style="margin-top:10px">Tải tài liệu khác</button></div>
  </div>
</div>

<input type="file" id="impfile" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var lessons=[],cur={l:0,s:0},playing=false,token=0,sentIdx=0,sentences=[],sample=null,busy=false;
var synth=window.speechSynthesis||null,voices=[];
var CHUNK=9000,MAXCHUNK=10,docName="",sentOrig=[],lastOrig=[],sentStart=0,T={items:[],total:0},seekWas=false;
function libGet(){try{return JSON.parse(localStorage.getItem("gv_lib")||"[]")}catch(e){return[]}}
function libSet(a){try{localStorage.setItem("gv_lib",JSON.stringify(a));return true}catch(e){return false}}
function saveDoc(){
  if(!docName||!lessons.length)return;
  var a=libGet().filter(function(x){return x.name!==docName});
  a.unshift({name:docName,date:Date.now(),lessons:lessons});
  if(!libSet(a))showErr("Không lưu được vì bộ nhớ trình duyệt đã đầy. Hãy xóa bớt bài giảng cũ.");
  renderSaved();
}
function renderSaved(){
  var a=libGet(),box=$("savedlist");box.innerHTML="";
  $("saved").classList.toggle("hide",!a.length);
  a.forEach(function(d){
    var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
    var open=document.createElement("button");open.className="les";open.style.margin="0";open.style.flex="1";
    open.textContent=d.name;
    var sm=document.createElement("small");sm.textContent=d.lessons.length+" bài · "+new Date(d.date).toLocaleDateString("vi-VN");open.appendChild(sm);
    open.onclick=function(){lessons=d.lessons;docName=d.name;$("err").classList.add("hide");openPlayer();$("gen").textContent="Đây là bài giảng đã lưu, không cần soạn lại.";};
    var del=document.createElement("button");del.textContent="Xóa";del.setAttribute("aria-label","Xóa "+d.name);
    del.onclick=function(){
      if(del.dataset.sure){libSet(libGet().filter(function(x){return x.name!==d.name}));renderSaved();return}
      del.dataset.sure="1";del.textContent="Chắc chắn xóa?";del.className="pri";
      setTimeout(function(){if(del.isConnected&&del.dataset.sure){delete del.dataset.sure;del.textContent="Xóa";del.className=""}},3000);
    };
    row.appendChild(open);row.appendChild(del);box.appendChild(row);
  });
}

if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}
var KEY="",OKEY="",PROV="anthropic",OMODEL="gpt-5.6-sol",lastErr=null;
try{KEY=localStorage.getItem("ak")||"";OKEY=localStorage.getItem("ok")||"";PROV=localStorage.getItem("prov")||"anthropic";OMODEL=localStorage.getItem("om")||OMODEL}catch(e){}
if(PROV!=="openai")PROV="anthropic";
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function curKey(){return PROV==="openai"?OKEY:KEY}
function provName(){return PROV==="openai"?"OpenAI":"Anthropic"}
function syncProv(){
  $("box_a").classList.toggle("hide",PROV==="openai");
  $("box_o").classList.toggle("hide",PROV!=="openai");
  $("keynote").textContent=PROV==="openai"
    ?"Khóa chỉ lưu trong trình duyệt của bạn và gửi thẳng tới OpenAI để soạn bài giảng. Lấy khóa tại platform.openai.com (có tính phí theo lượt dùng). Nếu OpenAI đổi tên model, bạn chỉ cần sửa ô tên model."
    :"Khóa chỉ lưu trong trình duyệt của bạn và gửi thẳng tới Anthropic để soạn bài giảng. Lấy khóa tại console.anthropic.com (có tính phí theo lượt dùng).";
}
$("key").value=KEY;$("okey").value=OKEY;$("omodel").value=OMODEL;$("prov").value=PROV;syncProv();
$("prov").onchange=function(){PROV=this.value==="openai"?"openai":"anthropic";store("prov",PROV);syncProv()};
$("key").addEventListener("input",function(){KEY=this.value.trim();store("ak",KEY)});
$("okey").addEventListener("input",function(){OKEY=this.value.trim();store("ok",OKEY)});
$("omodel").addEventListener("input",function(){OMODEL=this.value.trim()||"gpt-5.6-sol";store("om",OMODEL)});
function parseJson(t){
  var m=String(t).match(/\{[\s\S]*\}/);
  if(!m)throw new Error("AI không trả về định dạng JSON hợp lệ.");
  return JSON.parse(m[0]);
}
async function httpErr(r){
  var m="";try{var j=await r.json();m=(j&&j.error&&j.error.message)||""}catch(e){}
  var er=new Error("API "+r.status+(m?": "+m:""));er.status=r.status;er.code=r.status===429?"rate_limited":"http";return er;
}
async function askClaude(p){
  var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:8000,messages:[{role:"user",content:p}]})});
  if(!r.ok)throw await httpErr(r);
  var d=await r.json();
  return parseJson(d.content.map(function(x){return x.text||""}).join("").trim());
}
async function askOpenAI(p){
  var body={model:OMODEL,messages:[{role:"user",content:p}],response_format:{type:"json_object"}};
  function call(){return fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+OKEY},body:JSON.stringify(body)})}
  var r=await call();
  if(r.status===400){delete body.response_format;r=await call()}
  if(!r.ok)throw await httpErr(r);
  var d=await r.json(),c=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
  return parseJson((c||"").trim());
}
sample={json:function(p){return PROV==="openai"?askOpenAI(p):askClaude(p)}};

/* ---------- upload ---------- */
var drop=$("drop");
$("file").addEventListener("change",function(e){if(e.target.files[0])start(e.target.files[0])});
["dragover","dragenter"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
drop.addEventListener("drop",function(e){var f=e.dataTransfer.files[0];if(f)start(f)});

function setStatus(t,p){$("prog").classList.remove("hide");$("status").textContent=t;if(p!=null)$("barfill").style.width=p+"%"}
function showErr(t){var e=$("err");e.textContent=t;e.classList.remove("hide")}

async function start(file){
  $("err").classList.add("hide");
  if(!window.pdfjsLib){return showErr("Không tải được bộ đọc PDF. Hãy kiểm tra kết nối mạng và thử lại.")}
  if(busy)return;busy=true;lessons=[];docName=file.name.replace(/\.pdf$/i,"");
  try{
    setStatus("Đang đọc file PDF…",3);
    var buf=await file.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var text="";
    for(var i=1;i<=pdf.numPages;i++){
      var pg=await pdf.getPage(i),tc=await pg.getTextContent();
      
      // CẢI TIẾN 2: Tối ưu đọc text từ PDF để nối từ liền mạch hơn
      var pageText = tc.items.map(function(x){return x.str}).join(" ");
      text += pageText.replace(/\s+/g," ") + "\n";
      
      setStatus("Đang đọc trang "+i+"/"+pdf.numPages+"…",3+Math.round(i/pdf.numPages*12));
    }
    text=text.replace(/[ \t]+/g," ").trim();
    if(text.length<200){busy=false;$("prog").classList.add("hide");return showErr("File này gần như không có chữ chọn được, có thể là bản scan (ảnh chụp). Hãy thử file PDF có chữ bôi đen được.")}
    if(!curKey()){busy=false;$("prog").classList.add("hide");return showErr("Hãy nhập khóa API "+provName()+" ở khung phía trên trước khi tải PDF.")}
    await generate(text);
  }catch(e){showErr("Có lỗi khi xử lý: "+(e&&e.message?e.message:e));$("prog").classList.add("hide")}
  busy=false;
}

function chunkText(t){
  var out=[],i=0;
  while(i<t.length){
    var end=Math.min(i+CHUNK,t.length);
    if(end<t.length){var cut=t.lastIndexOf(". ",end);if(cut>i+CHUNK*0.6)end=cut+1}
    out.push(t.slice(i,end));i=end;
  }
  return out;
}

async function generate(text){
  var chunks=chunkText(text),total=Math.min(chunks.length,MAXCHUNK),opened=false,failed=0;
  for(var k=0;k<total;k++){
    setStatus("Đang soạn bài giảng phần "+(k+1)+"/"+total+"…",15+Math.round(k/total*85));
    $("gen").textContent=opened?"Đang soạn tiếp phần "+(k+1)+"/"+total+"…":"";
    var data=null;

function split(t){
  var m=String(t).replace(/\s+/g," ").replace(/([.!?…])\s+/g,"$1\u0001").split("\u0001"),out=[],orig=[];
  m.forEach(function(x,oi){
    x=x.trim();if(!x)return;
    while(x.length>170){var c=x.lastIndexOf(", ",170);if(c<60)c=x.lastIndexOf(" ",170);if(c<1)break;out.push(x.slice(0,c+1).trim());orig.push(oi);x=x.slice(c+1).trim()}
    out.push(x);orig.push(oi);
  });
  lastOrig=orig;return out;
}
function reveal(){
  var items=$("pts").children,n=items.length,S=Math.max(1,sentences.length);
  for(var k=0;k<n;k++){if(sentIdx>=Math.floor(k*S/n))items[k].classList.add("on")}
  var o=sentOrig[sentIdx]!=null?sentOrig[sentIdx]:sentIdx,oc=(sentOrig.length?sentOrig[sentOrig.length-1]:0)+1;
  var vw=$("vis").querySelectorAll(".vw"),m=vw.length,last=-1;
  for(var j=0;j<m;j++){
    var at=vw[j].getAttribute("data-at"),need=(at!==null&&at!=="")?Math.min(+at,oc-1):Math.floor(oc*(0.25+0.6*j/m));
    vw[j].classList.remove("focus");
    if(o>=need){vw[j].classList.add("on");if(vw[j].querySelector(".vi"))last=j}
  }
  if(last>=0)vw[last].classList.add("focus");
}
function setPlayLabel(){$("play").textContent=playing?"⏸ Tạm dừng":(sentIdx>0?"▶ Tiếp tục":"▶ Bắt đầu giảng")}

}
function pause(){

function step(tk){
  if(tk!==token||!playing)return;
  if(sentIdx>=sentences.length){return nextSlide(true)}
  if(synth){queueFrom(tk);return}
  var txt=sentences[sentIdx];
  $("cap").textContent=txt;sentStart=performance.now();reveal();talk(true);
  speak(txt,tk,function(){
    if(tk!==token||!playing)return;
    sentIdx++;step(tk);
  });
}
var LET={A:"ây",B:"bi",C:"xi",D:"đi",E:"i",F:"ép",G:"di",H:"ếch",I:"ai",J:"giây",K:"kây",L:"eo",M:"em",N:"en",O:"âu",P:"pi",Q:"kiu",R:"a",S:"ét",T:"ti",U:"diu",V:"vi",W:"đắp liu",X:"ếch",Y:"quai",Z:"dét"};
var ACR={RAM:"ram",NASA:"na sa",ASEAN:"a xê an",UNESCO:"diu nét xcô",COVID:"cô vít",WIFI:"oai phai"};
function esc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function pron(txt,slide){
  var out=txt,terms=(slide&&slide.terms)||[];
  terms.filter(function(t){return t&&t.w&&t.say}).sort(function(a,b){return String(b.w).length-String(a.w).length}).forEach(function(t){
    try{out=out.replace(new RegExp("(^|[^\\p{L}\\p{N}])("+esc(String(t.w))+")(?![\\p{L}\\p{N}])","gu"),function(m,p){return p+t.say})}catch(e){}
  });
  out=out.replace(/Wi-?Fi/gi,"oai phai");
  out=out.replace(/(^|[^\p{L}\p{N}])([A-Z]{2,6})(?![\p{L}\p{N}])/gu,function(m,p,w){
    if(/^[IVX]+$/.test(w))return m;
    if(ACR[w])return p+ACR[w];
    return p+w.split("").map(function(c){return LET[c]}).join(" ");
  });
  return out;
}
function gapMs(){return parseInt($("gap").value,10)||500}
function queueFrom(tk){
  var txt=sentences[sentIdx],n=sentences.length,fired=false;
  $("cap").textContent=txt;sentStart=performance.now();reveal();talk(true);
  var u=new SpeechSynthesisUtterance(pron(txt,lessons[cur.l].slides[cur.s])),v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang="vi-VN";
  u.rate=rate();
  function fin(){
    if(fired||tk!==token||!playing)return;fired=true;
    sentIdx++;
    if(sentIdx>=n){step(tk);return}
    talk(false);
    setTimeout(function(){step(tk)},gapMs());
  }
  u.onend=fin;
  u.onerror=function(e){if(e&&(e.error==="canceled"||e.error==="interrupted"))return;fin()};
  synth.speak(u);
}
function speak(txt,tk,done){
  var fired=false;function fin(){if(fired)return;fired=true;done()}
  if(!synth){setTimeout(fin,Math.max(1200,txt.length*70)/rate());return}
  var u=new SpeechSynthesisUtterance(txt);
  var v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="vi-VN";
  u.rate=rate();
  u.onend=fin;u.onerror=function(){if(tk===token)setTimeout(fin,Math.max(1000,txt.length*60))};

}
function rate(){return parseFloat($("rate").value)||1}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function est(t){var w=String(t).split(/\s+/).filter(Boolean).length;return w/2.6/rate()+gapMs()/1000}
function buildTimes(){
  var t=0,arr=[];
  flat().forEach(function(p){
    var S=lessons[p[0]].slides[p[1]],ss=split(S.script),cum=[],a=0;
    ss.forEach(function(x){cum.push(a);a+=est(x)});a+=1;
    arr.push({l:p[0],s:p[1],start:t,cum:cum,dur:a});t+=a;
  });
  T={items:arr,total:t};
}
function curTime(){
  if(!T.items.length)return 0;
  var it=T.items[pos()]||T.items[0],base=it.start+(sentIdx<it.cum.length?it.cum[sentIdx]:it.dur),el=0;
  if(playing&&sentIdx<sentences.length)el=Math.min(est(sentences[sentIdx]),(performance.now()-sentStart)/1000);
  return base+el;
}

var recording=false,recorder=null,recStream=null,recChunks=[],recMime="",recUrl="";

function normLessons(d){

  var out=[];
  d.forEach(function(L){
    if(!L||!Array.isArray(L.slides))return;
    var sl=[];
    L.slides.forEach(function(x){

      var o={heading:x.heading,script:x.script,points:Array.isArray(x.points)?x.points.map(String):[]};
      if(x.visual&&typeof x.visual==="object"&&Array.isArray(x.visual.items))o.visual=x.visual;
      if(Array.isArray(x.terms))o.terms=x.terms;
      sl.push(o);
    });
    if(sl.length)out.push({title:String(L.title||"Bài "+(out.length+1)),slides:sl});
  });
  return out;
}
function importJson(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var ls=[];
    try{ls=normLessons(JSON.parse(r.result))}catch(e){}
    if(!ls.length){
      var m="File này không đúng định dạng kịch bản của trang (cần file JSON do nút Tải kịch bản JSON tạo ra).";
      if($("up").classList.contains("hide"))$("vmsg").textContent=m;else showErr(m);
      return;
    }
    if(recording)return;
    stop();lessons=ls;docName=f.name.replace(/\.json$/i,"");
    $("err").classList.add("hide");
    saveDoc();openPlayer();
    $("gen").textContent="Đã mở kịch bản từ file JSON.";
  };
  r.onerror=function(){showErr("Không đọc được file.")};
  r.readAsText(f);
}
$("impfile").onchange=function(){var f=this.files[0];this.value="";importJson(f)};
$("imp").onclick=function(){$("impfile").click()};
$("imp_up").onclick=function(){$("impfile").click()};

/* ---------- voices ---------- */
function loadVoices(){
  if(!synth){$("vmsg").textContent="Trình duyệt này không hỗ trợ giọng đọc. Giảng viên vẫn chạy theo phụ đề.";return}
  var all=synth.getVoices();
  var vi=all.filter(function(v){return /^vi/i.test(v.lang)});
  function score(v){var n=v.name;return(/natural/i.test(n)?4:0)+(/microsoft/i.test(n)?2:0)+(/google/i.test(n)?1:0)}
  voices=(vi.length?vi:all).slice().sort(function(a,b){return score(b)-score(a)});
  var sel=$("voice"),keep=sel.value;sel.innerHTML="";
  voices.forEach(function(v,i){var o=document.createElement("option");o.value=i;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});
  if(keep)sel.value=keep;
  $("vmsg").textContent=!vi.length?"Máy bạn chưa có giọng tiếng Việt, hãy cài giọng Vietnamese trong cài đặt hệ thống (hoặc dùng Chrome/Edge) để nghe chuẩn hơn.":(vi.some(function(v){return /natural/i.test(v.name)})?"":"Mẹo: mở trang bằng Microsoft Edge để có giọng tiếng Việt “Natural” (HoaiMy, NamMinh), nghe liền mạch và tự nhiên hơn.");
}
function pickVoice(){var i=parseInt($("voice").value,10);return voices[i]||null}
if(synth){synth.onvoiceschanged=loadVoices;loadVoices()}
renderSaved();
window.addEventListener("pagehide",function(){if(synth)synth.cancel()});
})();
</script>
